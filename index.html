<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<!-- 外部との通信をすべて禁止する（データはこの端末から出さない） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; font-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<title>Lap Logger</title>
<style>
:root{
  --bg:#0b0d10;--panel:#151a21;--panel2:#1d232c;--line:#2a313b;--text:#f2f4f7;--sub:#9aa3ae;
  --accent:#2f7bff;--good:#30d158;--bad:#ff453a;--best:#bf5af2;--warn:#ffd60a;--btn:#262d37;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);overscroll-behavior:none;
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(70px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{background:var(--btn);border:0;border-radius:12px;padding:12px 14px;font-weight:600;cursor:pointer}
button:active{filter:brightness(1.3)}
button:disabled{opacity:.45}
input,select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;font-size:16px}
h3{margin:22px 0 8px;font-size:15px;color:var(--sub);letter-spacing:.04em}
h4{margin:0 0 6px;font-size:13px;color:var(--sub);letter-spacing:.08em}
.note{color:var(--sub);font-size:14px;line-height:1.6}
.warnText{color:var(--warn)}
#homeNote{margin:0 0 10px}#homeNote:empty{display:none}
.row{display:flex;gap:8px;margin:8px 0}
.row>*{flex:1}
.row>button{flex:0 0 auto}
.row.eq>button{flex:1}
.wide{width:100%}
.sub{color:var(--sub);font-size:14px}
.good{color:var(--good)}.bad{color:var(--bad)}.bestc{color:var(--best)}
.danger{background:#5a1d1a;color:#fff}
.primary{background:var(--accent);color:#fff}
#banner{background:#5a4a00;color:#fff;padding:10px 16px;font-size:14px}
#updBar:not([hidden]){display:flex;align-items:center;justify-content:space-between;gap:10px;background:#12305e;color:#fff;padding:8px 16px;font-size:14px}
#updBar button{padding:8px 14px}
.dueBox:not([hidden]){display:flex;align-items:center;gap:10px;background:#3a3000;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.dueBox button{flex:0 0 auto;padding:8px 12px}
canvas{display:block;width:100%;background:var(--panel);border-radius:14px;touch-action:pan-y}
#cPreview{touch-action:none;cursor:crosshair}

nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#10141a;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border-radius:0;color:var(--sub);font-size:12px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
section{display:none;padding:12px 16px;padding-right:max(16px,env(safe-area-inset-right))}
section.on{display:block}
.wrap{max-width:760px;margin:0 auto}
body.recording{padding-bottom:env(safe-area-inset-bottom)}
body.recording nav{display:none}

/* GPS */
.gpsPill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#2a2f37;font-size:14px;font-weight:700;color:#fff}
.gpsPill::before{content:"";width:10px;height:10px;border-radius:50%;background:#888}
.gpsPill.ok{background:#123d22}.gpsPill.ok::before{background:var(--good)}
.gpsPill.weak{background:#453b00}.gpsPill.weak::before{background:var(--warn)}
.gpsPill.bad{background:#4a1512}.gpsPill.bad::before{background:var(--bad)}

/* ホーム */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.topbar select{max-width:55%;padding:7px 10px;font-size:15px}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.mcard{flex:0 0 100%;scroll-snap-align:center;background:linear-gradient(160deg,#18212d,#0f1318);border:1px solid var(--line);
  border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mcard h2{margin:0;font-size:30px;font-weight:900;font-style:italic;letter-spacing:.02em}
.mcard p{margin:2px 0 0;color:var(--sub);font-size:14px}
.outline{height:clamp(120px,27vh,300px);background:none}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
.fld select,.fld input{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--sub)}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dots{display:flex;justify-content:center;gap:10px;margin:10px 0}
.dots button{width:10px;height:10px;padding:0;border-radius:50%;background:#3a414c}
.dots button.on{background:#fff}
.startBtn{width:100%;padding:20px;font-size:22px;border-radius:16px;background:var(--accent);color:#fff;margin-top:10px;letter-spacing:.06em;
  position:sticky;bottom:calc(78px + env(safe-area-inset-bottom));box-shadow:0 6px 24px rgba(0,0,0,.6)}

/* 計測中（走行中はチラ見するだけなので、大きく・高コントラストに） */
body.recording{--bg:#000;--panel:#000;--sub:#e6e6e6;--line:#fff}
#live:not([hidden]){display:flex;flex-direction:column;gap:8px;
  min-height:calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 24px);
  min-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 24px)}
.runHead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.runMain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;text-align:center}
#runNote{margin:0}
.mainLbl{font-size:20px;font-weight:700;color:var(--sub)}
.big{font-size:clamp(56px,19vw,150px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.big.short{font-size:clamp(64px,27vw,200px)}
.mainSub{font-size:clamp(24px,8vw,48px);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dragList{font-size:20px;font-variant-numeric:tabular-nums;text-align:center;line-height:1.5}
.cells{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 12px;transition:background .3s;min-width:0}
.cell.span{grid-column:1/-1}
.cell.flash{background:#34404f;color:#fff}.cell.flash.good{background:#0d5c26;color:#fff}.cell.flash.bad{background:#7a1a14;color:#fff}.cell.flash.bestc{background:#4b1f6e;color:#fff}
.cell.flash .diff{color:#fff}
.lbl{font-size:16px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font-size:clamp(28px,9vw,56px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.diff{font-size:clamp(20px,6vw,36px);font-weight:700;font-variant-numeric:tabular-nums;min-height:1.2em;white-space:nowrap}
.gbox{display:flex;align-items:center;justify-content:center;gap:14px}
.gbox[hidden]{display:none}
#gCanvas{width:min(50vw,240px,28vh);background:none;border-radius:50%}
.gvals{font-size:15px;color:var(--sub);display:flex;flex-direction:column;gap:6px}
.gvals b{display:block;color:var(--text);font-size:26px;font-variant-numeric:tabular-nums}
.runBtns{position:relative;z-index:41} /* ラップ完了の全画面表示の上に出して、停止ボタンを隠さない */
.runBtns button{width:100%;padding:20px;font-size:22px;border-radius:16px}
.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.hold .fill{position:absolute;inset:0;background:rgba(255,255,255,.28);transform:scaleX(0);transform-origin:left}
.hold.pressing .fill{transform:scaleX(1);transition:transform 1s linear}
.hold span{position:relative;pointer-events:none}
/* ラップ完了：数秒だけ画面全体を結果の色にする（触っても下のボタンに届く） */
#lapFlash:not([hidden]){position:fixed;inset:0;z-index:40;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#1d4fa8;color:#fff;text-align:center;padding:16px;font-variant-numeric:tabular-nums}
#lapFlash.good{background:#0d6b2c}#lapFlash.bad{background:#a3150c}#lapFlash.bestc{background:#6a1fa0}
#lapFlash .lfN{font-size:clamp(24px,7vw,48px);font-weight:800}
#lapFlash .lfD{font-size:clamp(72px,28vw,220px);font-weight:900;line-height:1.05;white-space:nowrap}
#lapFlash .lfT{font-size:clamp(36px,12vw,96px);font-weight:800;white-space:nowrap}

/* 記録 */
.rcard,.lcard{display:block;width:100%;text-align:left;background:var(--panel);border-radius:16px;padding:14px;margin:8px 0;position:relative}
.rmode{display:inline-block;font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.08em}
.rtitle{display:block;font-size:19px;font-weight:700;margin:2px 0}
.rbest{position:absolute;right:14px;top:14px;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.rsub{display:block;color:var(--sub);font-size:13px;font-weight:500}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.back{width:44px;height:44px;border-radius:50%;font-size:24px;padding:0;flex:0 0 auto}
.htitle{font-size:19px;font-weight:700;line-height:1.3}
.block{background:var(--panel);border-radius:16px;padding:12px 14px;margin:10px 0;font-size:15px;line-height:1.6}
.lcard .lt{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.lcard .ls{font-size:14px;color:var(--sub);font-weight:500;line-height:1.5;margin-top:2px;padding-right:72px}
.lcard .det{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:1px solid #fff;border-radius:8px;padding:6px 10px;font-size:13px}
.lcard.best{background:#26213a}
.lcard{cursor:pointer}
.lcard.excl{opacity:.5}
.lcard .ex{position:absolute;right:12px;bottom:10px;padding:4px 10px;font-size:12px;border-radius:8px}
.lcard .det{top:14px;transform:none}
#consent:not([hidden]){position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px}
#consent .box{background:var(--panel);border-radius:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px}
#consent h2{margin:0 0 10px;font-size:22px}
#consent ul{padding-left:20px;line-height:1.7;font-size:15px}
#consent button{width:100%;padding:16px;font-size:18px;margin-top:8px}
.modal:not([hidden]){position:fixed;inset:0;z-index:49;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--panel);border-radius:18px;max-width:480px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.modal h2{margin:0 0 10px;font-size:20px}.modal p{overflow-wrap:anywhere}
.modal button{width:100%;padding:14px;margin-top:8px}
#qrCv{width:auto;max-width:100%;margin:8px auto;background:#fff;border-radius:8px;image-rendering:pixelated;touch-action:auto}
/* 色覚に配慮した配色 */
body.cb{--good:#4da3ff;--bad:#ff9f0a;--best:#f0e442}
/* 屋外向けの高コントラスト表示 */
body.hc{--bg:#000;--panel:#000;--panel2:#111;--line:#fff;--text:#fff;--sub:#e6e6e6;--btn:#222}
body.hc .cell,body.hc .block,body.hc .rcard,body.hc .lcard,body.hc .mcard,body.hc .lineCard{border:2px solid #fff}
body.hc .lbl,body.hc .note{font-size:16px}
body.hc button{border:2px solid #fff}
body.hc .lcard.excl{opacity:.8;text-decoration:line-through}
.player{display:flex;align-items:center;gap:10px;margin:10px 0}
.player input{flex:1;padding:0;accent-color:var(--accent);background:none;border:0}
.player button{width:52px;padding:12px 0}
.readout{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;font-variant-numeric:tabular-nums}
.readout div{background:var(--panel);border-radius:10px;padding:6px 10px}
.readout i{display:block;font-style:normal;font-size:12px;color:var(--sub)}
.readout b{font-size:18px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 8px}
.hrow h3{margin:0}
.hrow select{padding:6px 10px;font-size:15px}
.legend{font-size:13px;color:var(--sub);margin:6px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.grad{display:inline-block;width:110px;height:10px;border-radius:5px}
.lapGrid{display:grid;gap:0 18px}
@media (min-width:820px){.lapGrid{grid-template-columns:1.1fr 1fr}}

/* コース */
.seg{display:flex;gap:0;background:var(--panel2);border-radius:12px;padding:3px;margin:8px 0}
.seg button,.seg label{flex:1;background:none;border-radius:10px;padding:10px;text-align:center;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:8px}
.seg button.on{background:var(--accent);color:#fff}
.lineCard{background:var(--panel);border-radius:14px;padding:10px 12px;margin:10px 0}
.lineCard.sel{outline:2px solid var(--accent)}
.lineHead{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.lineHead .sub{text-align:right}
.lineBody{margin-top:8px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.pad button{padding:10px 4px;font-size:14px}
.pad .w2{grid-column:span 2}
.pad .w4{grid-column:span 4}
label.f{display:block;margin:10px 0;font-size:14px;color:var(--sub)}
label.f input{display:block;width:100%;margin-top:4px;color:var(--text)}
.chk{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:10px;padding:10px 12px;font-size:16px}
input[type=checkbox],input[type=radio]{width:22px;height:22px;padding:0;margin:0}

/* 横画面 */
@media (orientation:landscape){
  body{padding-bottom:0;padding-left:calc(84px + env(safe-area-inset-left))}
  body.recording{padding-left:env(safe-area-inset-left);padding-bottom:0}
  nav{top:0;bottom:0;right:auto;width:calc(84px + env(safe-area-inset-left));flex-direction:column;justify-content:center;
    border-top:0;border-right:1px solid var(--line);padding:env(safe-area-inset-top) 0 0 env(safe-area-inset-left)}
  nav button{flex:0 0 auto;padding:14px 0}
  .startBtn{bottom:10px}
  .mcard{display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:auto 1fr;gap:8px 16px;align-items:start}
  .mcard .outline{grid-row:1/3;grid-column:1;height:clamp(140px,52vh,320px)}
  #live:not([hidden]){display:grid;grid-template-columns:1.25fr 1fr;gap:6px 16px;align-items:stretch;
    grid-template-areas:"head head" "main cells" "g btns" "note note";grid-template-rows:auto 1fr auto auto}
  .runHead{grid-area:head}.runMain{grid-area:main}.cells{grid-area:cells}.gbox{grid-area:g}.runBtns{grid-area:btns;align-self:end}.cells{align-self:start}#runNote{grid-area:note}
  .big{font-size:clamp(40px,22vh,150px)}
  .big.short{font-size:clamp(48px,32vh,220px)}
  .mainSub{font-size:clamp(20px,9vh,48px)}
  .mainLbl{font-size:17px}
  .dragList{font-size:16px}
  .cell{padding:4px 10px}
  .lbl{font-size:14px}
  .val{font-size:clamp(22px,8vh,48px)}
  .diff{font-size:clamp(14px,5vh,28px)}
  .gbox{gap:10px;flex-direction:row}
  #gCanvas{width:min(26vh,18vw)}
  .gvals{flex-direction:row;gap:14px}
  .gvals b{display:inline;font-size:20px;margin-left:4px}
  .runBtns button{padding:14px;font-size:18px}
  #lapFlash .lfD{font-size:clamp(64px,36vh,240px)}
  #lapFlash .lfT{font-size:clamp(32px,15vh,110px)}
}
</style>
</head>
<body>
<div id="banner" hidden></div>
<div id="lapFlash" hidden aria-live="assertive"><div class="lfN" id="lfN"></div><div class="lfD" id="lfD"></div><div class="lfT" id="lfT"></div></div>
<div id="shareBox" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="shareH"><div class="box">
  <h2 id="shareH" data-i18n="shareCourse"></h2><p id="shareName"></p>
  <canvas id="qrCv" role="img" aria-label="QR"></canvas><p class="note" id="qrMsg"></p>
  <button id="qrCopy" class="primary" data-i18n="copyLink"></button><button id="qrFile" data-i18n="shareFile"></button><button id="qrClose" data-i18n="qrClose"></button>
</div></div>
<div id="impBox" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="impH"><div class="box">
  <h2 id="impH" data-i18n="impTitle"></h2><p id="impInfo"></p>
  <button id="impAdd" class="primary" data-i18n="impAdd"></button><button id="impCopy" data-i18n="impCopy"></button>
  <p class="note" data-i18n="impIosNote"></p><button id="impCancel" data-i18n="impCancel"></button>
</div></div>
<div id="consent" hidden><div class="box"><h2 data-i18n="consentTitle"></h2><div data-i18n-html="consentBody"></div><button id="consentOk" class="primary" data-i18n="consentOk"></button></div></div>
<div id="updBar" hidden><span data-i18n="updateAvail"></span><button id="updBtn" class="primary" data-i18n="updateBtn"></button></div>

<section id="v-run" class="on">
  <div id="home" class="wrap">
    <div class="topbar"><span class="gpsPill" data-gps><span class="gtxt"></span></span><select id="selVeh" aria-label="vehicle"></select></div>
    <div class="dueBox" id="dueBox" hidden><span id="dueText"></span><button id="dueBtn" class="primary" data-i18n="backupNow"></button></div>
    <p class="note" id="homeNote" aria-live="polite"></p>
    <div class="carousel" id="carousel">
      <div class="mcard" data-mode="circuit">
        <canvas class="outline" id="olCircuit"></canvas>
        <div><h2 data-i18n="modeCircuit"></h2><p data-i18n="descCircuit"></p></div>
        <label class="fld"><span data-i18n="course"></span><select id="selCircuit"></select></label>
      </div>
      <div class="mcard" data-mode="drag">
        <canvas class="outline" id="olDrag"></canvas>
        <div><h2 data-i18n="modeDrag"></h2><p data-i18n="descDrag"></p></div>
        <div class="fld"><span data-i18n="dragDists"></span><div class="chips" id="dragChips"></div><span data-i18n="dragSpeeds"></span></div>
      </div>
      <div class="mcard" data-mode="segment">
        <canvas class="outline" id="olSegment"></canvas>
        <div><h2 data-i18n="modeSegment"></h2><p data-i18n="descSegment"></p></div>
        <label class="fld"><span data-i18n="course"></span><select id="selSegment"></select></label>
      </div>
    </div>
    <div class="dots" id="dots"><button data-i="0" aria-label="1"></button><button data-i="1" aria-label="2"></button><button data-i="2" aria-label="3"></button></div>
    <button id="startBtn" class="startBtn" disabled></button>
  </div>
  <div id="live" hidden>
    <div class="runHead"><span class="gpsPill" data-gps><span class="gtxt"></span></span><span id="wakeText" class="sub"></span><span id="runLabel" class="sub"></span></div>
    <div class="runMain"><div class="mainLbl" id="mainLbl"></div><div class="big" id="mainVal">-:--.-</div><div class="mainSub" id="mainSub"></div><div class="dragList" id="dragList"></div></div>
    <div class="cells">
      <div class="cell" id="cellCur"><div class="lbl" id="lapNo"></div><div class="val" id="curLap">-:--.-</div></div>
      <div class="cell" id="cellLast"><div class="lbl" id="lblLast"></div><div class="val" id="lastLap">--</div><div class="diff" id="lastDiff"></div></div>
      <div class="cell" id="cellBest"><div class="lbl" data-i18n="pb"></div><div class="val" id="bestLap">--</div></div>
      <div class="cell" id="cellSec"><div class="lbl" id="secLbl"></div><div class="val" id="secTime">--</div><div class="diff" id="secDiff"></div></div>
    </div>
    <div class="gbox" id="gbox">

function ptOk(p){ return !!p && num(p.lat) && num(p.lon); }
function makeProj(lat0, lon0){
  const kx = Math.cos(lat0 * D2R) * R * D2R, ky = R * D2R;
  const f = p => ({ x: (p.lon - lon0) * kx, y: (p.lat - lat0) * ky });
  f.inv = q => ({ lat: lat0 + q.y / ky, lon: lon0 + q.x / kx });
  return f;
}
function distM(a, b){
  const dy = (b.lat - a.lat) * D2R * R, dx = (b.lon - a.lon) * D2R * R * Math.cos(a.lat * D2R);
  return Math.hypot(dx, dy);
}
function bearing(a, b){ return Math.atan2((b.lon - a.lon) * Math.cos(a.lat * D2R), b.lat - a.lat); }
function angDiff(a, b){ let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }

// ラインの両端（a が進行方向の左、b が右）
function lineSeg(l, proj){
  const c = proj(l.c), h = l.hdg * D2R, px = Math.cos(h), py = -Math.sin(h), r = l.w / 2;
  return { c, a: { x: c.x - px * r, y: c.y - py * r }, b: { x: c.x + px * r, y: c.y + py * r } };

// 走行区間 p1→p2 とライン q1→q2 の交点。t は p1→p2 上の位置 (0〜1)、sign は横切る向き
function segCross(p1, p2, q1, q2){
  const rx = p2.x - p1.x, ry = p2.y - p1.y, sx = q2.x - q1.x, sy = q2.y - q1.y;
  const den = rx * sy - ry * sx;
  if (Math.abs(den) < 1e-9) return null;
  const qx = q1.x - p1.x, qy = q1.y - p1.y;
  const t = (qx * sy - qy * sx) / den, u = (qx * ry - qy * rx) / den;
  if (t <= 0 || t > 1 || u < 0 || u > 1) return null;
  return { t, sign: den > 0 ? 1 : -1 };

// ---------- 判定 ----------
// サーキット：lines[0] がコントロールライン。セクターk はライン k-1 からライン k（最後はコントロールライン）まで。
// セグメント：lines[0] がスタート、最後がゴール。
class LapDetector {
  constructor(course, opt){
    this.opt = opt; this.loop = course.type !== 'segment';
    const c0 = course.lines[0].c;

    this.lines = course.lines.map(l => lineSeg(l, this.proj));
    this.n = this.lines.length;
    this.nSec = this.loop ? this.n : this.n - 1;
    // 通過の向き：ラインの向き（進行方向）が決まっていれば、その向きに越えたときだけ数える（-1 が進行方向）。
    // 決まっていなければ、最初に越えた向きにそろえる
    this.dir = course.lines.map(l => num(l.hdg) ? -1 : 0);
    this.prev = null; this.lapStart = null; this.lastSplit = 0; this.next = 1;
    this.splits = []; this.warn = false; this.laps = [];
  }
  push(p){
    const ev = [], xy = this.proj(p), cur = { t: p.t, x: xy.x, y: xy.y, v: p.v };
    const pr = this.prev;
    this.prev = cur;
    if (!pr || cur.t <= pr.t) return ev;
    const gap = cur.t - pr.t > 3000;
    if (gap && this.lapStart) this.warn = true;
    const hits = [];
    for (let i = 0; i < this.n; i++){
      if (i > 0 && (!this.lapStart || i < this.next)) continue;
      const L = this.lines[i], h = segCross(pr, cur, L.a, L.b);
      if (!h || (this.dir[i] && h.sign !== this.dir[i])) continue;
      const v = pr.v + h.t * (cur.v - pr.v);
      if (v < MIN_CROSS_V) continue;
      const x = pr.x + h.t * (cur.x - pr.x), y = pr.y + h.t * (cur.y - pr.y);
      hits.push({ i, sign: h.sign, v, t: pr.t + h.t * (cur.t - pr.t), ll: this.proj.inv({ x, y }) });
    }
    hits.sort((a, b) => a.t - b.t);
    for (const h of hits) this._hit(h, gap, ev);
    return ev;
  }
  _hit(h, gap, ev){
    if (h.i === 0){
      if (this.loop && this.lapStart){
        if (h.t - this.lapStart.t < this.opt.minLap * 1000) return;
        this._split(this.n, h, ev);
        this._finish(h, ev);
      }
      if (!this.dir[0]) this.dir[0] = h.sign;
      this.lapStart = h; this.lastSplit = h.t; this.next = 1;
      this.splits = new Array(this.nSec).fill(null); this.warn = gap;
      ev.push({ type: 'start', t: h.t, n: this.laps.length + 1 });
      return;
    }
    if (!this.dir[h.i]) this.dir[h.i] = h.sign;
    this._split(h.i, h, ev);
    if (!this.loop && h.i === this.n - 1) this._finish(h, ev);
  }
  _split(k, h, ev){
    if (k === this.next) this.splits[k - 1] = h.t - this.lastSplit;
    else for (let j = this.next; j <= k; j++) this.splits[j - 1] = null;
    this.lastSplit = h.t; this.next = k + 1;
    if (this.nSec > 1) ev.push({ type: 'sector', k, time: this.splits[k - 1], warn: this.warn });
  }
  _finish(h, ev){
    const s = this.lapStart;
    const lap = { kind: 'lap', n: this.laps.length + 1, start: s.t, end: h.t, time: h.t - s.t, splits: this.splits.slice(),
      warn: this.warn, sll: s.ll, sv: s.v, ell: h.ll, ev: h.v };

    ev.push({ type: 'lap', lap });

class DragDetector {
  constructor(opt){
    this.dists = ((opt && opt.dragDist && opt.dragDist.length) ? opt.dragDist : [200, 400]).slice().sort((a, b) => a - b);
    this.unit = opt && opt.unit === 'mph' ? 'mph' : 'km/h';
    this.spds = spdTargets(this.unit); this.k = this.unit === 'mph' ? MPH : KMH;
    this.state = 'wait'; this.still = null; this.rest = null; this.cur = null; this.laps = [];
    this.stillPts = null; this.prev = null;
  }
  push(p){
    const ev = [], prev = this.prev;
    this.prev = p;

    if (p.v < 1){
      if (this.still == null){ this.still = p.t; this.stillPts = []; }
      this.stillPts.push(p); if (this.stillPts.length > 30) this.stillPts.shift();
      this.rest = p;
      if (this.state === 'wait' && p.t - this.still >= 2000){ this.state = 'armed'; ev.push({ type: 'armed' }); }
      return ev;
    }
    if (this.state !== 'armed'){ this.still = null; return ev; }
    if (p.v < 2 || !this.rest) return ev;

    const r = this.rest, early = (this.stillPts || []).filter(q => q.t < p.t - 2500), base = early.length ? early : (this.stillPts || [r]);

    this.still = null;
    const waited = p.t - r.t;
    if (waited > 5000){ this.state = 'wait'; return ev; } // 測位が途切れた
    // 発進地点からの距離 d は (t - t0)² に比例する。発進後の2点が取れていれば、速度の値を使わずに t0 を求める
    const d2 = distM(A, p), d1 = prev ? distM(A, prev) : 0;

async function refreshSession(id){

  let s;

    if (refreshGen.get(id) !== gen) return;

    sessions.sort((a, b) => b.startedAt - a.startedAt);
    anaCache.delete(id);
  }
  if (curTab === 'v-rec'){ if (recState.view === 'lap' && lv.playing) renderPending = true; else renderRec(); }

// ベストラップの同じ地点と比べた、今のタイム差。pts は {t（ラップ開始からのミリ秒）, lat, lon}
class LiveDelta {
  constructor(pts){

  reset(){ this.i = 0; }
  _near(P, lo, hi, ok){

      const k = L2 ? clamp01(((P.x - a.x) * dx + (P.y - a.y) * dy) / L2) : 0, d = Math.hypot(a.x + k * dx - P.x, a.y + k * dy - P.y);

    }

  }

  at(p, lapStart){
    const n = this.p.length, el = p.t - lapStart, P = this.proj(p);
    if (n < 2) return null;
    // ふだんは前回の位置の近くだけを探す。見失ったら全体から探す（ただし経過時間が大きく違う所は除く：周回はスタートとゴールが重なるため）
    const near = t => Math.abs(t - el) < this.total * 0.3;
    let b = this._near(P, Math.max(0, this.i - 2), Math.min(n - 1, this.i + 30), near);
    if (!b || b.d > 40) b = this._near(P, 0, n - 1, near);

// 1周（lap：start・end・sll・ell）の走行ラインから、比べる相手を作る
function makeRef(points, lap){
  const pts = [{ t: 0, lat: lap.sll.lat, lon: lap.sll.lon }];
  for (const q of points) if (q.t > lap.start && q.t < lap.end) pts.push({ t: q.t - lap.start, lat: q.lat, lon: q.lon });
  pts.push({ t: lap.end - lap.start, lat: lap.ell.lat, lon: lap.ell.lon });

}

    const A = analyze(s);

}

  if (vis.length % 2) vis[vis.length - 1].classList.add('span');
}
function handleEvents(evs){
  const loop = rec.session.course.type !== 'segment';
  for (const e of evs){
    if (e.type === 'start'){
      live.lapStart = e.t; live.delta = null;
      if (live.ref) live.ref.reset();
      $('#lapNo').textContent = loop ? tx('lapN', e.n) : tx('segRun');
    } else if (e.type === 'lap'){
      const t = e.lap.time, pb = live.pbLap, d = $('#lastDiff'), best = !e.lap.warn && pb != null && t < pb;
      let cls = '';
      $('#lastLap').textContent = fmtLap(t) + (e.lap.warn ? '⚠' : '');
      if (pb == null) d.textContent = '';
      else if (best){ d.textContent = tx('bestBadge') + ' ' + fmtDiff(t - pb); cls = 'bestc'; }
      else { d.textContent = fmtDiff(t - pb); cls = diffCls(t - pb); }
      d.className = 'diff ' + cls;
      live.last = { n: e.lap.n, time: t, warn: e.lap.warn, diff: pb == null ? null : t - pb, cls, best };
      live.delta = null;
      if (!e.lap.warn && (pb == null || t < pb)){ live.pbLap = t; $('#bestLap').textContent = fmtLap(t); live.ref = makeRef(rec.session.points, e.lap); }
      if (!loop){ live.lapStart = null; $('#curLap').textContent = fmtLap(t); $('#lapNo').textContent = tx('segWait'); }
      flash('#cellLast', cls); lapFlash(live.last, loop);
    } else if (e.type === 'sector'){
      const b = live.pbSp[e.k - 1], d = $('#secDiff');
      $('#secLbl').textContent = tx('sectorN', e.k);
      let cls = '';
      if (e.time == null){ $('#secTime').textContent = '--'; d.textContent = tx('missed'); d.className = 'diff'; }
      else {
        $('#secTime').textContent = fmtSec(e.time);
        if (b == null) d.textContent = '';
        else { cls = diffCls(e.time - b); d.textContent = fmtDiff(e.time - b); d.className = 'diff ' + cls; }
        if (!e.warn && (b == null || e.time < b)) live.pbSp[e.k - 1] = e.time;
      }
      flash('#cellSec', cls);
    }
  }
}
function handleDrag(evs){
  const D = live.dragMain, pb = live.dragPb;
  for (const e of evs){
    if (e.type === 'armed') $('#lapNo').textContent = tx('dragReady');
    else if (e.type === 'start'){ live.lapStart = e.t; $('#lapNo').textContent = tx('dragRun'); $('#dragList').innerHTML = ''; $('#secTime').textContent = '--'; }
    else if (e.type === 'mark'){
      const b = pb.times[e.d], diff = b != null ? ` <span class="${diffCls(e.time - b)}">${fmtDiff(e.time - b)}</span>` : '';
      $('#dragList').insertAdjacentHTML('beforeend', `<div>${esc(tx('dragRunLine', e.d, fmtS(e.time), Math.round(e.v * spdK())))}${diff}</div>`);
    } else if (e.type === 'spd'){
      if (e.s === spdTargets(rec.session.settings.unit === 'mph' ? 'mph' : 'km/h')[0]) $('#secTime').textContent = fmtS(e.time);
      $('#dragList').insertAdjacentHTML('beforeend', `<div>${esc(tx('spdTime', e.s, fmtS(e.time), U()))}</div>`);
    } else if (e.type === 'finish'){
      const r = e.run, tm = r.times[D], d = $('#lastDiff'), b = pb.times[D];
      live.lapStart = null;
      $('#curLap').textContent = tm != null ? fmtS(tm) : fmtS(r.time);
      $('#lastLap').textContent = (tm != null ? fmtS(tm) : '--') + (r.warn ? '⚠' : '');
      if (tm == null || b == null) d.textContent = '';
      else { d.textContent = (tm < b && !r.warn ? tx('bestBadge') + ' ' : '') + fmtDiff(tm - b); d.className = 'diff ' + (tm < b ? 'bestc' : diffCls(tm - b)); }
      if (!r.warn){
        for (const [k, v] of Object.entries(r.times)) if (pb.times[k] == null || v < pb.times[k]) pb.times[k] = v;
        for (const [k, v] of Object.entries(r.spd)){ const key = r.spdUnit + ':' + k; if (pb.spd[key] == null || v < pb.spd[key]) pb.spd[key] = v; }
      }
      $('#bestLap').textContent = pb.times[D] != null ? fmtS(pb.times[D]) : '--';
      $('#lapNo').textContent = tx('dragDone');
      flash('#cellLast', tm != null && b != null ? (tm < b && !r.warn ? 'bestc' : diffCls(tm - b)) : '');
    }
  }
  renderMain();
}
async function wakeOn(){
  const w = $('#wakeText');
  if (!('wakeLock' in navigator)){ w.textContent = tx('wakeNo'); w.className = 'warnText'; return; }
  if (rec.wakeReq) return;
  rec.wakeReq = true;
  try {
    const lock = await navigator.wakeLock.request('screen');
    rec.wakeReq = false;
    if (!rec.on){ lock.release().catch(() => {}); return; }
    rec.wake = lock; rec.wakeHeld = true;
    w.textContent = tx('wakeOk'); w.className = 'sub';
    lock.addEventListener('release', () => {
      if (rec.wake !== lock) return;
      rec.wakeHeld = false;
      if (rec.on && document.visibilityState === 'visible') wakeOn();
    });
  } catch (e){ rec.wakeReq = false; w.textContent = tx('wakeFail'); w.className = 'warnText'; }
}
async function startRec(){
  if (rec.on || !ready) return;
  if (!consented()){ $('#consent').hidden = false; return; }
  const heldNow = await heldRecLocks();
  if (heldNow && [...heldNow].some(n => n.startsWith(LOCKP) && !rec.releasing.has(n))){ alert(tx('otherTab')); return; }
  if (!('geolocation' in navigator)){ alert(tx('noGeo')); return; }
  if (!window.isSecureContext){ alert(tx('needHttps')); return; }
  if (geo.denied){ // 設定で許可し直された場合に備えて、位置の取得をやり直す
    if (geo.watchId != null) navigator.geolocation.clearWatch(geo.watchId);
    geo.watchId = null; geo.denied = false; startGeo();
  }
  const mode = settings.mode, veh = curVehicle();
  let course = null;
  if (mode !== 'drag'){
    course = selCourse(mode);
    if (!course){ alert(tx('noCourse')); return; }
  }
  let basis = null;
  if (veh.type === 'car' && veh.cal){
    if (await motionPermission()) basis = makeBasis(veh.cal);
    else alert(tx('motionNo'));
  }
  if (course){ const p = courseProblem(course); if (p && !confirm(tx('courseIncomplete', p))) return; }
  if (veh.type === 'car' && !veh.cal && !confirm(tx('calNeededConfirm'))) return;
  if (rec.on) return;
  const s = { id: 's' + Date.now(), startedAt: Date.now(), mode, vehicle: vehSnap(veh), course: course ? clone(course) : null,
              settings: { minLap: settings.minLap, maxAcc: settings.maxAcc, dragDist: settings.dragDist.slice(), unit: settings.unit }, points: [], laps: [], active: true };
  if (veh.type === 'car') s.gs = [];
  rec.session = s; rec.on = true; rec.lastSave = rec.startedAt = Date.now();
  rec.det = mode === 'drag' ? new DragDetector(s.settings) : (courseProblem(s.course) ? null : new LapDetector(s.course, s.settings));
  sessions.unshift(s);
  holdRecLock(s.id);
  Object.assign(live, { lapStart: null, err: false, gEma: null, last: null, delta: null, pred: null, ref: null });
  $('#lapFlash').hidden = true;
  Object.assign(gm, { trail: [], cur: null, max: veh.type === 'car' ? 30 : 6 });
  Object.assign(mo, { basis, f: 0, l: 0, lastT: 0, lastStore: 0, count: 0 });
  if (basis) motionListen(true);
  ['#lastLap', '#bestLap', '#secTime', '#gLat', '#gLon'].forEach(k => $(k).textContent = '--');
  $('#lastDiff').textContent = ''; $('#secDiff').textContent = ''; $('#dragList').innerHTML = '';
  if (mode === 'drag'){
    live.dragMain = Math.max(...s.settings.dragDist); live.dragPb = dragBest(veh.id);
    $('#curLap').textContent = '0.00'; $('#lapNo').textContent = tx('dragStop');
    $('#lblLast').textContent = `${tx('lastRun')}  ${distLabel(live.dragMain)}`; $('#secLbl').textContent = `0-${spdTargets()[0]}${U()}`; $('#cellSec').hidden = false; $('#cellCur').hidden = true;
    if (live.dragPb.times[live.dragMain] != null) $('#bestLap').textContent = fmtS(live.dragPb.times[live.dragMain]);
    $('#runLabel').textContent = `${s.vehicle.name}・${tx('modeDrag')} ${s.settings.dragDist.map(distLabel).join('/')}`;
  } else {
    const pb = bestFor(veh.id, course);
    live.pbLap = pb.lap; live.pbSp = pb.sp.slice();
    $('#bestLap').textContent = fmtLap(pb.lap);
    $('#curLap').textContent = '-:--.-';
    $('#lapNo').textContent = !rec.det ? tx('recordOnly') : course.type === 'segment' ? tx('segWait') : tx('outLapWait');
    $('#lblLast').textContent = course.type === 'segment' ? tx('lastRun') : tx('lastLap'); $('#secLbl').textContent = tx('sector');
    $('#cellSec').hidden = nSecOf(course) < 2; $('#cellCur').hidden = false;
    const br = rec.det ? bestRef(veh.id, course) : null;
    live.ref = br ? makeRef(br.s.points, br.l) : null;
    $('#runLabel').textContent = `${s.vehicle.name}・${course.name}`;
  }
  $('#gbox').hidden = !settings.liveG; layoutCells();
  document.body.classList.add('recording'); $('#updBar').hidden = true;
  $('#home').hidden = true; $('#live').hidden = false;
  if (curTab !== 'v-run') showTab('v-run');
  startGeo(); wakeOn();
  setNote(tx('recNote'));
  if (veh.type === 'car' && !basis){ $('#gLat').textContent = tx('noG'); $('#gLon').textContent = ''; }
  drawGMeter(true); renderMain();
  DB.append(s).then(ok => { if (ok) bcast({ type: 'rec-start', id: s.id }); });
}
function stopRec(){
  if (!rec.on) return;
  rec.on = false;
  motionListen(false); mo.basis = null;
  if (rec.wake){ const w = rec.wake; rec.wake = null; rec.wakeHeld = false; w.release().catch(() => {}); }
  const s = rec.session;
  s.active = false; s.endedAt = Date.now();
  const unlock = rec.unlock; rec.unlock = null; rec.releasing.add(LOCKP + s.id);
  anaCache.delete(s.id);
  analyze(s);
  const cleanup = () => { if (unlock) unlock(); setTimeout(() => rec.releasing.delete(LOCKP + s.id), 1000); };
  DB.append(s).catch(() => false).then(ok => { cleanup(); if (ok) bcast({ type: 'rec-stop', id: s.id }); if (impC) setTimeout(showImport, 500); homeNote(); const el = $('#homeNote'); el.textContent = (ok ? tx('saved', 1) : tx('saveFail')) + (el.textContent ? ' ' + el.textContent : ''); el.className = 'note' + (ok ? '' : ' warnText'); });
  document.body.classList.remove('recording'); showUpdate(); $('#lapFlash').hidden = true;
  $('#home').hidden = false; $('#live').hidden = true; $('#wakeText').textContent = '';
  renderHome();
}

const recState = { view: 'list', sid: null, pi: 0, veh: '' };
function vehicleMap(){
  const m = new Map(vehicles.map(v => [v.id, v.name]));
  for (const s of sessions) if (s.vehicle && !m.has(s.vehicle.id)) m.set(s.vehicle.id, s.vehicle.name);
  return m;
}
function renderRec(){
  $('#recList').hidden = recState.view !== 'list';
  $('#recSess').hidden = recState.view !== 'sess';
  $('#recLap').hidden = recState.view !== 'lap';
  if (recState.view === 'list') renderRecList();
  else if (recState.view === 'sess') renderSess();

}

function renderSess(){
  const s = sessById(recState.sid);
  if (!s){ recState.view = 'list'; return renderRec(); }
  const A = analyze(s), drag = s.mode === 'drag', best = bestPiece(A), pts = s.points;
  const bl = sessBest(s);
  $('#sTitle').textContent = (drag ? tx('modeDrag') : s.course.name) + (bl ? ' – ' + bl : '');
  const dur = pts.length > 1 ? (pts[pts.length - 1].t - pts[0].t) / 1000 : 0;
  const hz = dur ? ((pts.length - 1) / dur).toFixed(1) : '0', acc = pts.length ? (pts.reduce((a, p) => a + p.acc, 0) / pts.length).toFixed(1) : '0';
  let h = `<div class="sub">${fmtDate(s.startedAt)}・${esc(s.vehicle ? s.vehicle.name : '')}</div>
    <div class="block">${esc(tx('statsGps', hz, pts.length, acc))}${s.gs ? '<br>' + esc(tx('statsG', s.gs.length)) : ''}`;
  if (!drag){
    if (!A.det) h += `<br><span class="warnText">${esc(courseProblem(s.course))}</span>`;
    const ok = A.laps.filter(l => !l.warn && !l.excl), n = nSecOf(s.course), bs = [];
    for (let k = 0; k < n; k++){ const v = ok.map(l => l.splits[k]).filter(x => x != null); bs[k] = v.length ? Math.min(...v) : null; }
    if (n > 1 && bs.every(x => x != null)) h += `<br><b>${esc(tx('theo', fmtLap(bs.reduce((a, b) => a + b, 0))))}</b><br>${bs.map((v, k) => `${k + 1}) ${fmtSec(v)}`).join(', ')}`;
    if (s.vehicle && A.det){ const pb = bestFor(s.vehicle.id, s.course); if (pb.lap != null) h += `<br>${esc(tx('pbVehCourse', fmtLap(pb.lap)))}`; }
  } else if (s.vehicle){
    const pb = dragBest(s.vehicle.id), D = dragMain(s);
    if (pb.times[D] != null) h += `<br>${esc(tx('pbVehDrag', `${distLabel(D)} ${fmtS(pb.times[D])}`))}`;
  }
  h += '</div>';
  if (!A.pieces.length) h += `<p class="note">${esc(tx('noLapsYet'))}</p>`;
  A.pieces.forEach((pc, i) => {
    const st = lapStats(s, A, pc);
    let title, lines;
    if (drag){
      const D = dragMain(s);
      title = `${pieceLabel(pc)}  ${pc.times[D] != null ? distLabel(D) + ' ' + fmtS(pc.times[D]) + tx('sec') : ''}`;
      lines = Object.keys(pc.times).sort((a, b) => a - b).map(d => tx('dragRunLine', d, fmtS(pc.times[d]), Math.round(pc.vAt[d] * spdK())))
        .concat(Object.keys(pc.spd).map(k => tx('spdTime', k, fmtS(pc.spd[k]), pc.spdUnit || 'km/h'))).concat([tx('maxSpd', Math.round(pc.maxV * spdK()))]);
    } else {
      title = `${pieceLabel(pc)}  ${fmtLap(pc.time)}`;
      lines = [tx('lapStat1', st.vmin.toFixed(1), st.vmax.toFixed(1), st.vavg.toFixed(1))];
      if (st.hasG) lines.push(tx('lapStat2', st.brake.toFixed(1), st.coast.toFixed(1)));
      if (pc.splits && pc.splits.length > 1) lines.push(pc.splits.map((v, k) => `S${k + 1} ${fmtSec(v)}`).join('  '));
    }
    const exable = pc.kind === 'lap' || pc.kind === 'run';
    h += `<div class="lcard${pc === best ? ' best' : ''}${pc.excl ? ' excl' : ''}" data-pi="${i}" role="button" tabindex="0"><div class="lt">${esc(title)}${pc.warn ? '⚠' : ''}${pc === best ? ' <span class="bestc">★</span>' : ''}${pc.excl ? esc(tx('exclTag')) : ''}</div>
      <div class="ls">${lines.map(esc).join('<br>')}</div><span class="det">${esc(tx('detail'))}</span>${exable ? `<button class="ex" data-ex="${i}">${esc(tx(pc.excl ? 'unexcl' : 'excl'))}</button>` : ''}</div>`;
  });
  h += `<p class="note">${esc(tx('statDef'))}</p>
    <button class="wide" data-sa="recalc">${esc(tx('recalc'))}</button>
    ${drag ? '' : `<button class="wide" style="margin-top:8px" data-sa="auto">${esc(tx('autoFromThis'))}</button>`}
    <div class="row eq"><button data-sa="csv">CSV</button><button data-sa="json">JSON</button><button data-sa="del" class="danger">${esc(tx('del'))}</button></div>`;
  $('#sBody').innerHTML = h;
}
$('#sBody').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('lcard')){ e.preventDefault(); e.target.click(); }
});
$('#sBody').addEventListener('click', async e => {
  const ex = e.target.closest('[data-ex]');
  if (ex){
    const s = sessById(recState.sid), pc = s && analyze(s).pieces[+ex.dataset.ex];
    if (!pc) return;
    if (s.active){ alert(tx('recalcActive')); return; }
    const ts = (s.excluded || []).filter(t => Math.abs(t - pc.start) >= 3000);
    s.excluded = pc.excl ? ts : ts.concat(pc.start);
    anaCache.delete(s.id); analyze(s); DB.saveMeta(s); renderSess();
    return;
  }
  const card = e.target.closest('.lcard');
  if (card){ recState.pi = +card.dataset.pi; lv.cmpKey = null; lv.t = 0; goRec('lap', true); return; }
  const b = e.target.closest('[data-sa]'); if (!b) return;
  const s = sessById(recState.sid); if (!s) return;
  const act = b.dataset.sa;
  if (act === 'recalc') recalcSession(s, true);
  else if (act === 'auto'){
    const c = courseById(s.course.id);
    if (!c){ alert(tx('courseGone')); return; }
    if (autoHeadings(c, [s])) { if (confirm(tx('autoRecalcConfirm', 1))) recalcSession(s, false); }
  } else if (act === 'csv') exportCsv(s);
  else if (act === 'json') download(`lap_${fileStamp(s.startedAt)}.json`, JSON.stringify(exportSess(s)), 'application/json');
  else if (act === 'del'){
    if (s.active){ alert(tx('delActive')); return; }
    if (!confirm(tx('delConfirm', fmtDate(s.startedAt)))) return;
    refreshGen.set(s.id, (refreshGen.get(s.id) || 0) + 1);
    if (DB.db && !(await DB.del(s.id))) return;
    sessions = sessions.filter(x => x.id !== s.id); anaCache.delete(s.id);
    history.state && history.state.rec ? history.back() : goRec('list', false);
  }

function recalcSession(s, ask, into){
  if (s.active){ alert(tx('recalcActive')); return false; }
  const v = s.vehicle && vehicles.find(x => x.id === s.vehicle.id);
  if (s.mode === 'drag'){
    if (ask && !confirm(tx('recalcDrag'))) return false;
    s.settings = Object.assign({}, s.settings, { dragDist: settings.dragDist.slice(), unit: settings.unit });
  } else {
    const c = into || (s.course && courseById(s.course.id));
    if (!c){ alert(tx('courseGone')); return false; }
    if (ask && !confirm(tx('recalcConfirm', c.name))) return false;
    s.course = clone(c);
    s.settings = Object.assign({}, s.settings, { minLap: settings.minLap, maxAcc: settings.maxAcc });
  }
  if (v) s.vehicle = vehSnap(v);
  s.rev = (s.rev || 0) + 1;
  analyze(s); DB.saveMeta(s);
  if (curTab === 'v-rec') renderRec();
  return true;
}
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
}
function exportCsv(s){
  const A = analyze(s), t0 = s.points.length ? s.points[0].t : 0, f3 = v => v == null ? '' : v.toFixed(3);
  const rows = ['time,elapsed_s,lat,lon,speed_kmh,accuracy_m,lap,g_lat,g_lon'];
  s.points.forEach((p, i) => {

function sanitizeSession(o){
  if (!o || typeof o.id !== 'string' || !num(o.startedAt) || !Array.isArray(o.points)) return null;
  const s = {};
  for (const k of Object.keys(o)) if (k[0] !== '_') s[k] = o[k];
  s.mode = MODES.includes(s.mode) ? s.mode : 'circuit';
  if (s.mode !== 'drag'){ if (!s.course || !Array.isArray(s.course.lines)) return null; migrateCourse(s.course); s.course.name = String(s.course.name || tx('untitled')); }
  s.points = s.points.filter(p => p && num(p.t) && num(p.lat) && num(p.lon) && num(p.v)).map(p => ({ t: p.t, lat: p.lat, lon: p.lon, v: p.v, acc: num(p.acc) ? p.acc : 0 }));
  if (Array.isArray(s.gs)) s.gs = s.gs.filter(g => Array.isArray(g) && g.length === 3 && g.every(num)); else delete s.gs;
  s.active = false;
  if (!s.vehicle || typeof s.vehicle.id !== 'string') s.vehicle = vehSnap(curVehicle());
  s.vehicle = { id: s.vehicle.id, name: String(s.vehicle.name || tx('untitled')), type: s.vehicle.type === 'car' ? 'car' : 'bike', flipF: !!s.vehicle.flipF, flipL: !!s.vehicle.flipL };

async function addSessions(list){

    if (old && old.active) continue;
    analyze(s);
    if (DB.db && !(await DB.putFull(s))) continue;
    sessions = sessions.filter(x => x.id !== s.id); sessions.push(s);
    anaCache.delete(s.id); analyze(s);
    n++;

  sessions.sort((a, b) => b.startedAt - a.startedAt);

}
async function importFile(file){

  let o;

  if (o && o.kind === 'backup' && o.app === 'lap-logger') return restoreBackup(o);
  if (o && o.kind === 'course' && o.app === 'lap-logger' && o.course && Array.isArray(o.course.lines)){
    addCourse(migrateCourse({ id: 'c' + Date.now(), name: String(o.course.name || tx('untitled')).slice(0, 80), type: o.course.type, lines: o.course.lines }));
    return;

  const s = sanitizeSession(o);

  const old = sessById(s.id);

}

    const fixes = [], label = btn.textContent;

      clearTimeout(winTimer); clearTimeout(maxTimer);

  showImport();
}
// 記録中は出さず、止めたあとに出す
function showImport(){
  if (!impC || rec.on) return;
  $('#impInfo').textContent = tx('impInfo', impC.name, tx(impC.type === 'segment' ? 'modeSegment' : 'modeCircuit'), impC.lines.length);
  $('#impBox').hidden = false;
}
window.addEventListener('hashchange', () => { if (ready) try { checkHashImport(); } catch (err){} });
$('#impAdd').addEventListener('click', () => { $('#impBox').hidden = true; if (impC){ const c = impC; impC = null; c.id = 'c' + Date.now(); addCourse(c); } });
$('#impCopy').addEventListener('click', () => copyText(impCode));
$('#impCancel').addEventListener('click', () => { $('#impBox').hidden = true; impC = null; });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ $('#shareBox').hidden = true; if (!$('#impBox').hidden){ $('#impBox').hidden = true; impC = null; } } });
$('#cImport').addEventListener('click', () => $('#impFile').click());
$('#cDel').addEventListener('click', () => {
  if (courses.length < 2){ alert(tx('oneCourse')); return; }
  const c = editCourse();
  if (!confirm(tx('delCourseConfirm', c.name))) return;
  courses = courses.filter(x => x !== c); cv.id = courses[0].id; cv.sel = 0; cv.trace = null; cv.z = 1; cv.ox = cv.oy = 0; saveCourses(); renderCourseTab();
});
$('#cAuto').addEventListener('click', () => {
  const c = editCourse(), arr = traceSessions(c);
  if (!arr.length) return;
  if (autoHeadings(c, arr)) offerRecalc(c, arr);
});

// ---------- 設定タブ ----------
function renderSettings(){
  $$('#langSeg button').forEach(b => b.classList.toggle('on', b.dataset.l === settings.lang));
  $$('#unitSeg button').forEach(b => b.classList.toggle('on', b.dataset.u === settings.unit));
  $('#optHc').checked = !!settings.hc; $('#optCb').checked = !!settings.cb; $('#optLiveG').checked = !!settings.liveG;
  $$('#mainSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === (settings.liveMain === 'delta' ? 'delta' : 'last')));
  const v = curVehicle();
  $('#vehSel').innerHTML = vehicles.map(x => `<option value="${esc(x.id)}"${x.id === v.id ? ' selected' : ''}>${esc(x.name)}（${esc(tx(x.type === 'car' ? 'car' : 'bike'))}）</option>`).join('');
  $('#vehName').value = v.name;
  $$('input[name=vehType]').forEach(r => r.checked = r.value === v.type);
  $('#bikeBox').hidden = v.type !== 'bike'; $('#carBox').hidden = v.type !== 'car';
  $('#flipF').checked = !!v.flipF; $('#flipL').checked = !!v.flipL;
  if (v.cal){ const b = makeBasis(v.cal); $('#calInfo').textContent = tx('calDone', fmtDate(v.cal.at), Math.round(Math.asin(Math.max(-1, Math.min(1, b.up[2]))) / D2R)); }
  else $('#calInfo').textContent = tx('calNot');
  $('#optMinLap').value = settings.minLap; $('#optAcc').value = settings.maxAcc;
  const lb = LS.get('lastBackup', 0);
  $('#lastBackup').textContent = lb ? tx('lastBackupAt', fmtDate(lb)) : tx('neverBackup');
  $('#verInfo').textContent = tx('verInfo', APP_VERSION);
  renderBackups();
}
function applyLook(){ document.body.classList.toggle('hc', !!settings.hc); document.body.classList.toggle('cb', !!settings.cb); }
$('#unitSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; settings.unit = b.dataset.u; saveSettings(); anaCache.forEach(A => A.pieces.forEach(pc => delete pc._st)); applyLang(); renderTab(); });
$('#mainSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; settings.liveMain = b.dataset.m; saveSettings(); renderSettings(); });
$('#optLiveG').addEventListener('change', e => { settings.liveG = e.target.checked; saveSettings(); });
$('#optHc').addEventListener('change', e => { settings.hc = e.target.checked; saveSettings(); applyLook(); });
$('#optCb').addEventListener('change', e => { settings.cb = e.target.checked; saveSettings(); applyLook(); });
// 不具合の報告用。走行データや位置は入れない
async function deviceInfo(){
  const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate().catch(() => null) : null;
  const persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted().catch(() => null) : null;
  const mb = b => b == null ? '?' : (b / 1048576).toFixed(1) + 'MB';
  return [
    `Lap Logger ${APP_VERSION} (schema ${SCHEMA})`,
    `UA: ${navigator.userAgent}`,
    `lang: ${navigator.language} / app: ${settings.lang}, unit: ${settings.unit}, hc: ${!!settings.hc}, cb: ${!!settings.cb}`,
    `screen: ${screen.width}x${screen.height} @${window.devicePixelRatio}, orientation: ${screenAngle()}`,
    `standalone: ${matchMedia('(display-mode: standalone)').matches || !!navigator.standalone}, sw: ${!!(navigator.serviceWorker && navigator.serviceWorker.controller)}`,
    `wakeLock: ${'wakeLock' in navigator}, motion: ${typeof DeviceMotionEvent !== 'undefined'}, locks: ${!!navigator.locks}`,
    `storage: ${mb(est && est.usage)} / ${mb(est && est.quota)}, persisted: ${persisted}, db: ${!!DB.db}`,
    `recordings: ${sessions.length}, tracks: ${courses.length}, vehicles: ${vehicles.length} (${vehicles.map(v => v.type).join(',')})`,
    `gps: ${geo.denied ? 'denied' : live.lastFixAt ? 'ok ±' + Math.round(live.acc) + 'm' : 'none'}`
  ].join('\n');
}
$('#copyInfo').addEventListener('click', async () => {
  const t = await deviceInfo();
  try { await navigator.clipboard.writeText(t); alert(tx('copied')); }
  catch (e){ prompt(tx('copyManual'), t); }
});
$('#openIssues').addEventListener('click', () => { window.open('https://github.com/kiha81-png/lap-logger/issues/new', '_blank', 'noopener'); });
$('#showConsent').addEventListener('click', () => { $('#consent').hidden = false; });
$('#langSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; settings.lang = b.dataset.l; saveSettings(); applyLang(); renderTab(); });
$('#vehSel').addEventListener('change', e => { vehicleId = e.target.value; saveVehicles(); renderSettings(); });
$('#vehName').addEventListener('change', e => { curVehicle().name = e.target.value.trim() || tx('untitled'); saveVehicles(); renderSettings(); });
$$('input[name=vehType]').forEach(r => r.addEventListener('change', () => { curVehicle().type = r.value; saveVehicles(); renderSettings(); }));
$('#flipF').addEventListener('change', e => { curVehicle().flipF = e.target.checked; saveVehicles(); });
$('#flipL').addEventListener('change', e => { curVehicle().flipL = e.target.checked; saveVehicles(); });
$('#vehNew').addEventListener('click', () => {
  const v = { id: 'v' + Date.now(), name: tx('newVehicle'), type: 'car', cal: null, flipF: false, flipL: false };
  vehicles.push(v); vehicleId = v.id; saveVehicles(); renderSettings(); $('#vehName').focus();
});
$('#vehDel').addEventListener('click', () => {
  if (vehicles.length < 2){ alert(tx('oneVeh')); return; }
  if (!confirm(tx('delVehConfirm', curVehicle().name))) return;
  vehicles = vehicles.filter(v => v.id !== vehicleId); vehicleId = vehicles[0].id; saveVehicles(); renderSettings();
});
$('#calBtn').addEventListener('click', async () => {
  const v = curVehicle(), btn = $('#calBtn');
  if (!(await motionPermission())){ alert(tx('motionPerm')); return; }
  btn.disabled = true; btn.textContent = tx('calMeasuring');
  mo.cal = []; const wasOn = mo.listening; motionListen(true);
  await sleep(2000);
  const arr = mo.cal; mo.cal = null;
  if (!wasOn && !rec.on) motionListen(false);
  btn.disabled = false; btn.textContent = tx('calBtn');
  if (arr.length < 10){ alert(tx('calNoData')); return; }
  const g = [0, 1, 2].map(k => arr.reduce((a, x) => a + x[k], 0) / arr.length), m = Math.hypot(...g);
  const shake = Math.max(...arr.map(x => Math.hypot(x[0] - g[0], x[1] - g[1], x[2] - g[2])));
  if (Math.abs(m - G0) > 1.5 || shake > 1.5){ alert(tx('calShake')); return; }
  const cal = { g, angle: screenAngle(), at: Date.now() };
  if (Math.abs(vdot(g, screenUpDevice(cal.angle))) / m < 0.5){ alert(tx('calRotate')); return; }
  if (makeBasis(cal).flat < 0.3){ alert(tx('calFlat')); return; }
  v.cal = cal; saveVehicles(); renderSettings();
});
[['#optMinLap', 'minLap', 5], ['#optAcc', 'maxAcc', 3]].forEach(([sel, key, min]) =>
  $(sel).addEventListener('change', e => {
    const v = parseFloat(e.target.value);
    settings[key] = num(v) ? Math.max(min, v) : DEFAULT_OPT[key];
    saveSettings(); renderSettings();
  }));

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (curTab === 'v-run'){ if (rec.on) drawGMeter(true); else renderHome(); }
    if (curTab === 'v-rec' && recState.view === 'lap'){ buildLapLayers(); lvUpdate(); }
    if (curTab === 'v-course'){ drawCoursePreview(); drawLineZoom(); }
  }, 150);
});

// ---------- 起動 ----------
(async () => {
  applyLang();
  try {
    await DB.open();
    sessions = await DB.loadAll();
  } catch (e){ showBanner(tx('dbFail')); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const held = await heldRecLocks();
  let otherRec = false;
  for (const s of sessions){
    let dirty = false;
    if (s.active){ if (!held || held.has(LOCKP + s.id)) otherRec = !!held || otherRec; else { s.active = false; dirty = true; } }                      // 前回、記録中に閉じられたもの
    if (!s.vehicle){ s.vehicle = vehSnap(vehicles[0]); dirty = true; }    // 車両の登録より前の記録
    if (!s.mode){ s.mode = 'circuit'; dirty = true; }
    if (s.course && s.course.lines && (!s.course.type || s.course.lines.some(l => l && typeof l === 'object' && 'a' in l))){ migrateCourse(s.course); dirty = true; }
    if (dirty) DB.saveMeta(s);
  }
  sessions.sort((a, b) => b.startedAt - a.startedAt);
  saveCourses();
  ready = true;
  $('#startBtn').disabled = false;
  applyLang();
  renderHome();
  if (consented()) startGeo();
  setupSW();
  applyLook();
  if (otherRec) showBanner(tx('otherTab'));
  if (!consented()) $('#consent').hidden = false;
  try { checkHashImport(); } catch (err){}
  checkBattery();
})();
$('#consentOk').addEventListener('click', () => { consentNow = true; LS.set('consent', CONSENT_VER); $('#consent').hidden = true; startGeo(); });
// 電池が少ないときは、ホームで知らせる（Android の Chrome など、対応しているブラウザだけ）
let battery = null;
function checkBattery(){
  if (!navigator.getBattery) return;
  navigator.getBattery().then(b => {
    battery = b;
    ['levelchange', 'chargingchange'].forEach(t => b.addEventListener(t, () => { if (curTab === 'v-run' && !rec.on) homeNote(); }));
    if (curTab === 'v-run' && !rec.on) homeNote();
  }).catch(() => {});
}

// ---------- オフライン（Service Worker）と更新 ----------
let swWaiting = null;
function showUpdate(){ if (swWaiting && !rec.on) $('#updBar').hidden = false; }
function setupSW(){
  if (!('serviceWorker' in navigator) || !window.isSecureContext || !/^https?:$/.test(location.protocol)) return;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const track = w => w && w.addEventListener('statechange', () => {
      if (w.state === 'installed' && navigator.serviceWorker.controller){ swWaiting = w; showUpdate(); }
    });
    if (reg.waiting && navigator.serviceWorker.controller){ swWaiting = reg.waiting; showUpdate(); }
    reg.addEventListener('updatefound', () => track(reg.installing));
  }).catch(() => {});
  let reloading = false;
  // 計測中は読み込み直さない。更新は「更新」ボタンを押したときだけ
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading || rec.on) return;
    reloading = true; location.reload();
  });
}
$('#updBtn').addEventListener('click', () => { if (rec.on || !swWaiting) return; $('#updBar').hidden = true; swWaiting.postMessage('skip'); });
$('#dueBtn').addEventListener('click', backupAll);
