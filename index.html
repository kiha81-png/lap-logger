<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<!-- 外部との通信をすべて禁止する（データはこの端末から出さない） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Lap Logger</title>
<style>
:root{
  --bg:#0b0d10;--panel:#151a21;--panel2:#1d232c;--line:#2a313b;--text:#f2f4f7;--sub:#9aa3ae;
  --accent:#2f7bff;--good:#30d158;--bad:#ff453a;--best:#bf5af2;--warn:#ffd60a;--btn:#262d37;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);overscroll-behavior:none;
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{background:var(--btn);border:0;border-radius:12px;padding:12px 14px;font-weight:600;cursor:pointer}
button:active{filter:brightness(1.3)}
button:disabled{opacity:.45}
input,select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;font-size:16px}
h3{margin:22px 0 8px;font-size:15px;color:var(--sub);letter-spacing:.04em}
h4{margin:0 0 6px;font-size:13px;color:var(--sub);letter-spacing:.08em}
.note{color:var(--sub);font-size:14px;line-height:1.6}
.warnText{color:var(--warn)}
.row{display:flex;gap:8px;margin:8px 0}
.row>*{flex:1}
.row>button{flex:0 0 auto}
.row.eq>button{flex:1}
.wide{width:100%}
.sub{color:var(--sub);font-size:14px}
.good{color:var(--good)}.bad{color:var(--bad)}.bestc{color:var(--best)}
.danger{background:#5a1d1a;color:#fff}
.primary{background:var(--accent);color:#fff}
#banner{background:#5a4a00;color:#fff;padding:10px 16px;font-size:14px}
canvas{display:block;width:100%;background:var(--panel);border-radius:14px;touch-action:pan-y}

nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#10141a;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border-radius:0;color:var(--sub);font-size:12px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
section{display:none;padding:12px 16px;padding-right:max(16px,env(safe-area-inset-right))}
section.on{display:block}
.wrap{max-width:760px;margin:0 auto}
body.recording{padding-bottom:env(safe-area-inset-bottom)}
body.recording nav{display:none}

/* GPS */
.gpsPill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#2a2f37;font-size:14px;font-weight:700;color:#fff}
.gpsPill::before{content:"";width:10px;height:10px;border-radius:50%;background:#888}
.gpsPill.ok{background:#123d22}.gpsPill.ok::before{background:var(--good)}
.gpsPill.weak{background:#453b00}.gpsPill.weak::before{background:var(--warn)}
.gpsPill.bad{background:#4a1512}.gpsPill.bad::before{background:var(--bad)}

/* ホーム */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.topbar select{max-width:55%;padding:7px 10px;font-size:15px}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.mcard{flex:0 0 100%;scroll-snap-align:center;background:linear-gradient(160deg,#18212d,#0f1318);border:1px solid var(--line);
  border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mcard h2{margin:0;font-size:30px;font-weight:900;font-style:italic;letter-spacing:.02em}
.mcard p{margin:2px 0 0;color:var(--sub);font-size:14px}
.outline{height:clamp(120px,27vh,300px);background:none}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
.fld select,.fld input{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--sub)}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dots{display:flex;justify-content:center;gap:10px;margin:10px 0}
.dots button{width:10px;height:10px;padding:0;border-radius:50%;background:#3a414c}
.dots button.on{background:#fff}
.startBtn{width:100%;padding:20px;font-size:22px;border-radius:16px;background:var(--accent);color:#fff;margin-top:10px;letter-spacing:.06em;
  position:sticky;bottom:calc(78px + env(safe-area-inset-bottom));box-shadow:0 6px 24px rgba(0,0,0,.6)}

/* 計測中 */
#live:not([hidden]){display:grid;grid-template-columns:1fr;gap:8px;grid-template-areas:"head" "time" "cells" "g" "btns" "note"}
.runHead{grid-area:head;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.runTime{grid-area:time}.cells{grid-area:cells}.gbox{grid-area:g}.runBtns{grid-area:btns}#runNote{grid-area:note;margin:0}
.big{font-size:clamp(56px,21vw,150px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05;text-align:center;letter-spacing:-.02em}
.lapno{text-align:center;color:var(--sub);font-size:18px}
.dragList{font-size:20px;font-variant-numeric:tabular-nums;text-align:center;line-height:1.5}
.cells{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{background:var(--panel);border-radius:14px;padding:10px 12px;transition:background .2s;min-width:0}
.cell.flash{background:#34404f}
.lbl{font-size:14px;color:var(--sub)}
.val{font-size:clamp(30px,10vw,64px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.diff{font-size:clamp(20px,6vw,36px);font-weight:700;font-variant-numeric:tabular-nums;min-height:1.2em;white-space:nowrap}
.gbox{display:flex;align-items:center;justify-content:center;gap:14px}
#gCanvas{width:min(62vw,260px);background:none;border-radius:50%}
.gvals{font-size:15px;color:var(--sub);display:flex;flex-direction:column;gap:6px}
.gvals b{display:block;color:var(--text);font-size:26px;font-variant-numeric:tabular-nums}
.runBtns button{width:100%;padding:22px;font-size:22px;border-radius:16px}
.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.hold .fill{position:absolute;inset:0;background:rgba(255,255,255,.28);transform:scaleX(0);transform-origin:left}
.hold.pressing .fill{transform:scaleX(1);transition:transform 1s linear}
.hold span{position:relative;pointer-events:none}

/* 記録 */
.rcard,.lcard{display:block;width:100%;text-align:left;background:var(--panel);border-radius:16px;padding:14px;margin:8px 0;position:relative}
.rmode{display:inline-block;font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.08em}
.rtitle{display:block;font-size:19px;font-weight:700;margin:2px 0}
.rbest{position:absolute;right:14px;top:14px;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.rsub{display:block;color:var(--sub);font-size:13px;font-weight:500}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.back{width:44px;height:44px;border-radius:50%;font-size:24px;padding:0;flex:0 0 auto}
.htitle{font-size:19px;font-weight:700;line-height:1.3}
.block{background:var(--panel);border-radius:16px;padding:12px 14px;margin:10px 0;font-size:15px;line-height:1.6}
.lcard .lt{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.lcard .ls{font-size:14px;color:var(--sub);font-weight:500;line-height:1.5;margin-top:2px;padding-right:72px}
.lcard .det{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:1px solid #fff;border-radius:8px;padding:6px 10px;font-size:13px}
.lcard.best{background:#26213a}
.player{display:flex;align-items:center;gap:10px;margin:10px 0}
.player input{flex:1;padding:0;accent-color:var(--accent);background:none;border:0}
.player button{width:52px;padding:12px 0}
.readout{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;font-variant-numeric:tabular-nums}
.readout div{background:var(--panel);border-radius:10px;padding:6px 10px}
.readout i{display:block;font-style:normal;font-size:12px;color:var(--sub)}
.readout b{font-size:18px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 8px}
.hrow h3{margin:0}
.hrow select{padding:6px 10px;font-size:15px}
.legend{font-size:13px;color:var(--sub);margin:6px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.grad{display:inline-block;width:110px;height:10px;border-radius:5px}
.lapGrid{display:grid;gap:0 18px}
@media (min-width:820px){.lapGrid{grid-template-columns:1.1fr 1fr}}

/* コース */
.seg{display:flex;gap:0;background:var(--panel2);border-radius:12px;padding:3px;margin:8px 0}
.seg button,.seg label{flex:1;background:none;border-radius:10px;padding:10px;text-align:center;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:8px}
.seg button.on{background:var(--accent);color:#fff}
.lineCard{background:var(--panel);border-radius:14px;padding:10px 12px;margin:10px 0}
.lineCard.sel{outline:2px solid var(--accent)}
.lineHead{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.lineHead .sub{text-align:right}
.lineBody{margin-top:8px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.pad button{padding:10px 4px;font-size:14px}
.pad .w2{grid-column:span 2}
.pad .w4{grid-column:span 4}
label.f{display:block;margin:10px 0;font-size:14px;color:var(--sub)}
label.f input{display:block;width:100%;margin-top:4px;color:var(--text)}
.chk{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:10px;padding:10px 12px;font-size:16px}
input[type=checkbox],input[type=radio]{width:22px;height:22px;padding:0;margin:0}

/* 横画面 */
@media (orientation:landscape){
  body{padding-bottom:0;padding-left:calc(84px + env(safe-area-inset-left))}
  body.recording{padding-left:env(safe-area-inset-left);padding-bottom:0}
  nav{top:0;bottom:0;right:auto;width:calc(84px + env(safe-area-inset-left));flex-direction:column;justify-content:center;
    border-top:0;border-right:1px solid var(--line);padding:env(safe-area-inset-top) 0 0 env(safe-area-inset-left)}
  nav button{flex:0 0 auto;padding:14px 0}
  .startBtn{bottom:10px}
  .mcard{display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:auto 1fr;gap:8px 16px;align-items:start}
  .mcard .outline{grid-row:1/3;grid-column:1;height:clamp(140px,52vh,320px)}
  #live:not([hidden]){grid-template-columns:1fr auto;gap:6px 16px;align-items:start;
    grid-template-areas:"head head" "time g" "cells g" "cells btns" "note note"}
  .big{font-size:clamp(40px,20vh,130px)}
  .lapno{font-size:15px}
  .dragList{font-size:16px}
  .cell{padding:6px 10px}
  .val{font-size:clamp(22px,8vh,56px)}
  .diff{font-size:clamp(14px,5vh,32px)}
  .gbox{flex-direction:column;gap:6px}
  #gCanvas{width:min(46vh,34vw)}
  .gvals{flex-direction:row;gap:14px}
  .gvals b{display:inline;font-size:20px;margin-left:4px}
  .runBtns{align-self:end}
  .runBtns button{padding:14px;font-size:18px}
}
</style>
</head>
<body>
<div id="banner" hidden></div>

<section id="v-run" class="on">
  <div id="home" class="wrap">
    <div class="topbar"><span class="gpsPill" data-gps><span class="gtxt"></span></span><select id="selVeh" aria-label="vehicle"></select></div>
    <div class="carousel" id="carousel">
      <div class="mcard" data-mode="circuit">
        <canvas class="outline" id="olCircuit"></canvas>
        <div><h2 data-i18n="modeCircuit"></h2><p data-i18n="descCircuit"></p></div>
        <label class="fld"><span data-i18n="course"></span><select id="selCircuit"></select></label>
      </div>
      <div class="mcard" data-mode="drag">
        <canvas class="outline" id="olDrag"></canvas>
        <div><h2 data-i18n="modeDrag"></h2><p data-i18n="descDrag"></p></div>
        <div class="fld"><span data-i18n="dragDists"></span><div class="chips" id="dragChips"></div><span data-i18n="dragSpeeds"></span></div>
      </div>
      <div class="mcard" data-mode="segment">
        <canvas class="outline" id="olSegment"></canvas>
        <div><h2 data-i18n="modeSegment"></h2><p data-i18n="descSegment"></p></div>
        <label class="fld"><span data-i18n="course"></span><select id="selSegment"></select></label>
      </div>
    </div>
    <div class="dots" id="dots"><button data-i="0" aria-label="1"></button><button data-i="1" aria-label="2"></button><button data-i="2" aria-label="3"></button></div>
    <p class="note" id="homeNote"></p>
    <button id="startBtn" class="startBtn" disabled></button>
  </div>
  <div id="live" hidden>
    <div class="runHead"><span class="gpsPill" data-gps><span class="gtxt"></span></span><span id="wakeText" class="sub"></span><span id="runLabel" class="sub"></span></div>
    <div class="runTime"><div class="big" id="curLap">-:--.-</div><div class="lapno" id="lapNo"></div><div class="dragList" id="dragList"></div></div>
    <div class="cells">
      <div class="cell" id="cellLast"><div class="lbl" id="lblLast"></div><div class="val" id="lastLap">--</div><div class="diff" id="lastDiff"></div></div>
      <div class="cell"><div class="lbl" data-i18n="pb"></div><div class="val" id="bestLap">--</div></div>
      <div class="cell" id="cellSec"><div class="lbl" id="secLbl"></div><div class="val" id="secTime">--</div><div class="diff" id="secDiff"></div></div>
      <div class="cell"><div class="lbl" data-i18n="speedKmh"></div><div class="val" id="speed">--</div></div>
    </div>
    <div class="gbox">
      <canvas id="gCanvas"></canvas>
      <div class="gvals"><div><span data-i18n="gLat"></span><b id="gLat">--</b></div><div><span data-i18n="gLon"></span><b id="gLon">--</b></div></div>
    </div>
    <div class="runBtns"><button id="stopBtn" class="danger hold"><span class="fill"></span><span data-i18n="holdStop"></span></button></div>
    <p class="note" id="runNote"></p>
  </div>
</section>

<section id="v-rec"><div class="wrap" style="max-width:1100px">
  <div id="recList">
    <div class="row"><select id="recVeh" aria-label="vehicle"></select><button id="impJson" data-i18n="importJson"></button></div>
    <div id="recCards"></div>
    <p class="note" data-i18n="iosNote"></p>
  </div>
  <div id="recSess" hidden>
    <div class="hdr"><button class="back" data-back aria-label="back">‹</button><div class="htitle" id="sTitle"></div></div>
    <div id="sBody"></div>
  </div>
  <div id="recLap" hidden>
    <div class="hdr"><button class="back" data-back aria-label="back">‹</button><div class="htitle" id="lTitle"></div></div>
    <div class="row"><select id="cmpSel" aria-label="compare"></select></div>
    <div class="player"><button id="playBtn" class="primary">▶</button><input type="range" id="seek" min="0" max="1000" step="100" value="0"><button id="rateBtn">×1</button></div>
    <div class="readout" id="readout"></div>
    <div class="lapGrid">
      <div>
        <div class="hrow"><h3 data-i18n="map"></h3>
          <select id="mapMode"><option value="v" data-i18n="mSpeed"></option><option value="lat" data-i18n="gLat"></option><option value="lon" data-i18n="gLon"></option><option value="sum" data-i18n="mSum"></option></select></div>
        <canvas id="lMap"></canvas>
        <div class="legend" id="lMapLegend"></div>
        <p class="note" data-i18n="tapHint"></p>
      </div>
      <div>
        <h3 data-i18n="speedGraph"></h3><canvas id="lSpd"></canvas><div class="legend" id="lSpdLegend"></div>
        <div id="deltaBox"><h3 data-i18n="deltaGraph"></h3><canvas id="lDelta"></canvas></div>
        <h3 data-i18n="gGraph"></h3><canvas id="lG"></canvas><div class="legend" id="lGLegend"></div>
        <h3 data-i18n="ggTitle"></h3><canvas id="lGG"></canvas>
      </div>
    </div>
    <div class="block" id="lStats"></div>
  </div>
  <input type="file" id="impFile" accept=".json,application/json" hidden>
</div></section>

<section id="v-course"><div class="wrap">
  <div class="row"><select id="cSel" aria-label="track"></select><button id="cNew" data-i18n="newBtn"></button></div>
  <label class="f"><span data-i18n="courseName"></span><input id="cName" autocomplete="off"></label>
  <div class="seg" id="cType"><button data-t="circuit" data-i18n="typeCircuit"></button><button data-t="segment" data-i18n="typeSegment"></button></div>
  <p class="note" data-i18n="howToPoint"></p>
  <canvas id="cPreview"></canvas>
  <div id="cLines"></div>
  <button id="cAddLine" class="wide" data-i18n="addSector"></button>
  <h3 data-i18n="autoHdgTitle"></h3>
  <p class="note" data-i18n="autoHdgNote"></p>
  <div class="row"><select id="cSessSel" aria-label="recording"></select><button id="cAuto" class="primary" data-i18n="autoBtn"></button></div>
  <h3 data-i18n="deleteCourse"></h3>
  <button id="cDel" class="danger wide" data-i18n="delCourseBtn"></button>
</div></section>

<section id="v-set"><div class="wrap">
  <h3 data-i18n="language"></h3>
  <div class="seg" id="langSeg"><button data-l="ja">日本語</button><button data-l="en">English</button></div>
  <h3 data-i18n="vehicle"></h3>
  <div class="row"><select id="vehSel" aria-label="vehicle"></select><button id="vehNew" data-i18n="newBtn"></button></div>
  <label class="f"><span data-i18n="vehName"></span><input id="vehName" autocomplete="off"></label>
  <div class="seg">
    <label><input type="radio" name="vehType" value="bike"><span data-i18n="bike"></span></label>
    <label><input type="radio" name="vehType" value="car"><span data-i18n="car"></span></label>
  </div>
  <p class="note" id="bikeBox" data-i18n="bikeNote"></p>
  <div id="carBox">
    <p class="note" data-i18n-html="carNote"></p>
    <button id="calBtn" class="wide" data-i18n="calBtn"></button>
    <p class="note" id="calInfo"></p>
    <p class="note" data-i18n="flipNote"></p>
    <div class="row"><label class="chk"><input type="checkbox" id="flipF"><span data-i18n="flipF"></span></label><label class="chk"><input type="checkbox" id="flipL"><span data-i18n="flipL"></span></label></div>
  </div>
  <button id="vehDel" class="danger wide" data-i18n="delVeh"></button>
  <h3 data-i18n="judge"></h3>
  <label class="f"><span data-i18n="minLap"></span><input id="optMinLap" type="number" inputmode="decimal" min="5"></label>
  <label class="f"><span data-i18n="maxAcc"></span><input id="optAcc" type="number" inputmode="decimal" min="3"></label>
  <p class="note" data-i18n="minCross"></p>
</div></section>

<nav>
  <button data-v="v-run" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M9 2h6M12 2v3"/></svg><span data-i18n="tabRun"></span></button>
  <button data-v="v-rec"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span data-i18n="tabRec"></span></button>
  <button data-v="v-course"><svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h6a4 4 0 0 0 0-8h-4a4 4 0 0 1 0-8h6"/></svg><span data-i18n="tabCourse"></span></button>
  <button data-v="v-set"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span data-i18n="tabSet"></span></button>
</nav>

<script>
'use strict';
// ---------- 言語 ----------
const I18N = {
  ja: {
    tabRun: '計測', tabRec: '記録', tabCourse: 'コース', tabSet: '設定',
    modeCircuit: 'サーキット', modeDrag: 'ドラッグ', modeSegment: 'セグメント',

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const R = 6371008.8, D2R = Math.PI / 180, G0 = 9.80665;
const MIN_CROSS_V = 4;                 // m/s。これ未満のライン通過は数えない
const BRAKE_G = -0.15, ACCEL_G = 0.05; // ブレーキ・惰性の判定
const MODES = ['circuit', 'drag', 'segment'];
const DRAG_DISTS = [200, 400, 800, 1000, 1200, 1600], DRAG_SPDS = [100, 200];
const PAL = ['#2f7bff','#ff9f0a','#30d158','#ff453a','#bf5af2','#64d2ff','#ffd60a','#ff6482','#ac8e68','#5e5ce6'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));
const pad2 = n => String(n).padStart(2, '0');
const num = Number.isFinite;

function fmtLap(ms, dec = 2){
  if (ms == null || !num(ms)) return '--';
  const u = 10 ** dec, c = Math.round(Math.max(0, ms) / (1000 / u));
  const sec = Math.floor(c / u), m = Math.floor(sec / 60);
  return `${m}:${pad2(sec % 60)}.${String(c % u).padStart(dec, '0')}`;
}
const fmtS = ms => ms == null ? '--' : (ms / 1000).toFixed(2);
const fmtSec = ms => ms == null ? '--' : ms >= 60000 ? fmtLap(ms) : fmtS(ms);

const DB = {
  db: null,
  open(){
    return new Promise((res, rej) => {
      const r = indexedDB.open('lapLogger', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('sessions', { keyPath: 'id' });
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  write(fn){
    if (!this.db) return Promise.resolve(null); // 保存領域が使えない（起動時に案内済み）
    return new Promise(res => {
      try {
        const trn = this.db.transaction('sessions', 'readwrite');
        fn(trn.objectStore('sessions'));
        trn.oncomplete = () => res(true);
        trn.onerror = trn.onabort = () => res(false);
      } catch (e){ res(false); }
    });
  },
  put(s){ return this.write(st => st.put(s)).then(ok => { if (ok === false) showBanner(tx('saveFailBanner')); return !!ok; }); },
  del(id){ return this.write(st => st.delete(id)); },
  all(){
    if (!this.db) return Promise.resolve([]);
    return new Promise((res, rej) => {
      const r = this.db.transaction('sessions', 'readonly').objectStore('sessions').getAll();
      r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error);
    });
  }
};

class LapDetector {

      const L = this.lines[i], h = segCross(pr, cur, L.a, L.b);

      const v = pr.v + h.t * (cur.v - pr.v);
      if (v < MIN_CROSS_V) continue;
      const x = pr.x + h.t * (cur.x - pr.x), y = pr.y + h.t * (cur.y - pr.y);
      hits.push({ i, sign: h.sign, v, t: pr.t + h.t * (cur.t - pr.t), ll: this.proj.inv({ x, y }) });
    }

  }

    if (h.i === 0){

        this._split(this.n, h, ev);
        this._finish(h, ev);
      }
      if (!this.dir[0]) this.dir[0] = h.sign;
      this.lapStart = h; this.lastSplit = h.t; this.next = 1;
      this.splits = new Array(this.nSec).fill(null); this.warn = gap;
      ev.push({ type: 'start', t: h.t, n: this.laps.length + 1 });
      return;
    }
    if (!this.dir[h.i]) this.dir[h.i] = h.sign;
    this._split(h.i, h, ev);
    if (!this.loop && h.i === this.n - 1) this._finish(h, ev);
  }

  }

    const s = this.lapStart;
    const lap = { kind: 'lap', n: this.laps.length + 1, start: s.t, end: h.t, time: h.t - s.t, splits: this.splits.slice(),
      warn: this.warn, sll: s.ll, sv: s.v, ell: h.ll, ev: h.v };
    this.laps.push(lap);
    ev.push({ type: 'lap', lap });
    this.lapStart = null;
  }
}

      times: c.times, vAt: c.vAt, spd: c.spd, maxV: c.maxV, dist: c.dist, warn: c.warn, splits: [] };

    }
    A.laps = A.det ? A.det.laps : [];

function zigzag(vals, prom){
  const out = [];

  for (let i = 1; i < vals.length; i++){
    const v = vals[i];
    if (v == null) continue;

    if (vals[hi] == null) hi = i;
    if (mode === 0){
      if (v > vals[hi]) hi = i;
      if (v < vals[lo]) lo = i;
      if (vals[hi] - vals[lo] >= prom){ mode = hi > lo ? 1 : -1; ci = mode === 1 ? hi : lo; if (mode === 1) out.push({ i: lo, type: 'min' }); else out.push({ i: hi, type: 'max' }); }
      continue;
    }
    if (mode === 1){ if (v > vals[ci]) ci = i; else if (vals[ci] - v >= prom){ out.push({ i: ci, type: 'max' }); mode = -1; ci = i; } }
    else { if (v < vals[ci]) ci = i; else if (v - vals[ci] >= prom){ out.push({ i: ci, type: 'min' }); mode = 1; ci = i; } }
  }
  if (mode) out.push({ i: ci, type: mode === 1 ? 'max' : 'min' });

}

  const { ctx, w, h } = g, x0 = w * 0.25, y0 = h * 0.82, x1 = w * 0.75, y1 = h * 0.18;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  const ang = Math.atan2(y1 - y0, x1 - x0) + Math.PI / 2, k = 16;
  for (const [x, y] of [[x0, y0], [x1, y1]]){ ctx.beginPath(); ctx.moveTo(x - Math.cos(ang) * k, y - Math.sin(ang) * k); ctx.lineTo(x + Math.cos(ang) * k, y + Math.sin(ang) * k); ctx.stroke(); }

        ${i === 0 || (c.type === 'segment' && i === c.lines.length - 1) ? '' : `<button class="w4 danger" data-act="del">${esc(tx('delLine'))}</button>`}
      </div></div>` : ''}
  </div>`;
}
function previewData(c, cx){
  const pts = [];
  for (const s of courseSessions(c).slice(0, 5)) pts.push(s.points);
  return pts;
}
function drawCoursePreview(){
  const g = setupCanvas($('#cPreview'), 280); if (!g) return;
  const c = editCourse(), { ctx, w, h } = g, ready = c.lines.filter(l => ptOk(l.c));
  if (!ready.length) return canvasMsg(ctx, tx('noLinesYet'));
  const proj = makeProj(ready[0].c.lat, ready[0].c.lon), traces = previewData(c).map(ps => ps.map(proj));
  const pts = [].concat(...traces, ...ready.map(l => num(l.hdg) ? [lineSeg(l, proj).a, lineSeg(l, proj).b] : [proj(l.c)]));
  const f = fitter(pts.length > 1 ? pts : pts.concat([{ x: 60, y: 60 }, { x: -60, y: -60 }]), w, h, 22);
  ctx.strokeStyle = '#4a525e'; ctx.lineWidth = 1.5;
  traces.forEach(tr => strokePath(ctx, tr, f));
  drawCourseLines(ctx, f, c, proj, cv.sel);
}
function drawLineZoom(){
  const el = $('[data-zoom]'); if (!el) return;
  const g = setupCanvas(el, 240); if (!g) return;
  const c = editCourse(), l = c.lines[cv.sel], { ctx, w, h } = g;
  if (!ptOk(l.c)) return canvasMsg(ctx, tx('needPoint'));
  const proj = makeProj(l.c.lat, l.c.lon), Rm = Math.max(35, l.w * 0.9);
  const sc = Math.min(w, h) / (2 * Rm), f = p => [w / 2 + p.x * sc, h / 2 - p.y * sc];
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
  ctx.strokeStyle = '#5b6470'; ctx.lineWidth = 1.5;
  for (const ps of previewData(c)){
    ctx.beginPath(); let pen = false;
    for (const p of ps){ const q = proj(p); if (Math.abs(q.x) > Rm * 3 || Math.abs(q.y) > Rm * 3){ pen = false; continue; } if (pen) ctx.lineTo(...f(q)); else { ctx.moveTo(...f(q)); pen = true; } }
    ctx.stroke();
  }
  c.lines.forEach((o, i) => { if (i !== cv.sel && ptOk(o.c) && num(o.hdg)){ const s = lineSeg(o, proj); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(...f(s.a)); ctx.lineTo(...f(s.b)); ctx.stroke(); } });
  if (num(l.hdg)){
    const s = lineSeg(l, proj);
    ctx.strokeStyle = '#2f7bff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(...f(s.a)); ctx.lineTo(...f(s.b)); ctx.stroke();
    const tip = { x: Math.sin(l.hdg * D2R) * 14, y: Math.cos(l.hdg * D2R) * 14 };
    ctx.strokeStyle = '#ffd60a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(...f({ x: 0, y: 0 })); ctx.lineTo(...f(tip)); ctx.stroke();
    const back = a => ({ x: tip.x - Math.sin((l.hdg + a) * D2R) * 5, y: tip.y - Math.cos((l.hdg + a) * D2R) * 5 });
    ctx.beginPath(); ctx.moveTo(...f(back(30))); ctx.lineTo(...f(tip)); ctx.lineTo(...f(back(-30))); ctx.stroke();
  }
  ctx.fillStyle = '#2f7bff'; ctx.beginPath(); ctx.arc(w / 2, h / 2, 4, 0, 2 * Math.PI); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(12, h - 12); ctx.lineTo(12 + 10 * sc, h - 12); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '11px system-ui'; ctx.fillText('10 m', 12, h - 18);
}
// ライン中心から radius 以内を通った走行区間（向きと、中心に一番近い点）
function nearSegs(c, sessArr, radius){
  const pr = makeProj(c.lat, c.lon), out = [];
  for (const s of sessArr){
    const ps = s.points;
    for (let i = 1; i < ps.length; i++){
      if (ps[i].t - ps[i - 1].t > 3000) continue;
      const a = pr(ps[i - 1]), b = pr(ps[i]), dx = b.x - a.x, dy = b.y - a.y, L2 = dx * dx + dy * dy;
      if (L2 < 1) continue;
      const k = Math.max(0, Math.min(1, -(a.x * dx + a.y * dy) / L2)), q = { x: a.x + k * dx, y: a.y + k * dy }, d = Math.hypot(q.x, q.y);
      if (d <= radius) out.push({ q, dir: Math.atan2(dx, dy), d });
    }
  }
  return { out, pr };
}
function autoHeadingLine(l, sessArr){
  const { out } = nearSegs(l.c, sessArr, 25);
  if (!out.length) return 'none';
  let sx = 0, sy = 0;
  for (const o of out){ sx += Math.sin(o.dir); sy += Math.cos(o.dir); }
  if (Math.hypot(sx, sy) / out.length < 0.5) return 'mixed';
  l.hdg = ((Math.atan2(sx, sy) / D2R) + 360) % 360;
  return 'ok';
}
function autoHeadings(c, sessArr){
  const msgs = []; let n = 0;
  c.lines.forEach((l, i) => {
    if (!ptOk(l.c)) return;
    const r = autoHeadingLine(l, sessArr);
    if (r === 'ok') n++; else msgs.push(tx(r === 'none' ? 'autoNoNear' : 'autoMixed', lineName(c, i)));
  });
  saveCourses();
  alert([tx('autoDone', n)].concat(msgs).join('\n'));
  if (curTab === 'v-course') renderCourseTab();
  return n > 0;
}
function snapLine(l, sessArr){
  const { out, pr } = nearSegs(l.c, sessArr, 25);
  const ref = num(l.hdg) ? l.hdg * D2R : null;
  const use = out.filter(o => ref == null || Math.cos(o.dir - ref) > 0.7);
  if (!use.length) return false;
  const mx = use.reduce((a, o) => a + o.q.x, 0) / use.length, my = use.reduce((a, o) => a + o.q.y, 0) / use.length;
  l.c = pr.inv({ x: mx, y: my });
  return true;
}
function refreshLine(){
  const c = editCourse(), l = c.lines[cv.sel], card = $(`.lineCard[data-i="${cv.sel}"]`);
  saveCourses();
  if (card){
    card.querySelector('[data-sum]').textContent = lineSummary(l);
    const inp = card.querySelector('[data-f=pt]'); if (inp) inp.value = ptOk(l.c) ? l.c.lat.toFixed(6) + ', ' + l.c.lon.toFixed(6) : '';
  }
  drawCoursePreview(); drawLineZoom();
}
function sampleHere(btn){
  return new Promise(resolve => {
    if (!('geolocation' in navigator) || !window.isSecureContext){ alert(tx('needHttps')); return resolve(null); }
    const fixes = [], label = btn.textContent;
    let done = false, winTimer = null, id = null;
    btn.disabled = true; btn.textContent = tx('measuring', '');
    const finish = () => {
      if (done) return; done = true;
      if (id != null) navigator.geolocation.clearWatch(id);
      clearTimeout(winTimer); clearTimeout(maxTimer);
      btn.disabled = false; btn.textContent = label;
      if (!fixes.length){ alert(tx('noHere')); return resolve(null); }
      const bestAcc = Math.min(...fixes.map(f => f.accuracy)), use = fixes.filter(f => f.accuracy <= bestAcc * 1.5);
      const avg = k => use.reduce((a, f) => a + f[k], 0) / use.length;
      resolve({ lat: avg('latitude'), lon: avg('longitude') });
    };
    const maxTimer = setTimeout(finish, 20000);
    id = navigator.geolocation.watchPosition(p => {
      fixes.push(p.coords); btn.textContent = tx('measuring', fixes.length);
      if (!winTimer) winTimer = setTimeout(finish, 6000);
    }, e => { if (e.code === 1){ alert(tx('geoDeniedShort')); finish(); } }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  });
}
$('#cLines').addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const card = el.closest('.lineCard'), i = +card.dataset.i, c = editCourse(), l = c.lines[i], act = el.dataset.act;
  if (act === 'pick'){ cv.sel = i; renderCourseTab(); return; }
  const v = +el.dataset.v, needPt = ['mv', 'sd', 'rot', 'wd', 'snap', 'hdg1'];
  if (needPt.includes(act) && !ptOk(l.c)){ alert(tx('needPoint')); return; }
  if (act === 'mv' || act === 'sd'){ const h = num(l.hdg) ? l.hdg : 0; l.c = offsetLL(l.c, act === 'mv' ? h : h + 90, v); }
  else if (act === 'rot') l.hdg = (((num(l.hdg) ? l.hdg : 0) + v) % 360 + 360) % 360;
  else if (act === 'wd') l.w = Math.max(4, Math.min(200, l.w + v));
  else if (act === 'snap'){ if (!snapLine(l, courseSessions(c))){ alert(tx('snapNo')); return; } }
  else if (act === 'hdg1'){ const r = autoHeadingLine(l, courseSessions(c)); if (r !== 'ok'){ alert(tx(r === 'none' ? 'autoNoNear' : 'autoMixed', lineName(c, i))); return; } }
  else if (act === 'paste'){
    try { const p = parseLatLon(await navigator.clipboard.readText()); if (!p){ alert(tx('badPoint')); return; } l.c = p; }
    catch (err){ alert(tx('pasteFail')); return; }
  } else if (act === 'here'){
    const r = await sampleHere(el);
    if (!r) return;
    if (c.lines.includes(l)) l.c = r;
    else if (c.lines[i]) c.lines[i].c = r; // 測定中に種別を切り替えて、線が作り直された
    else return;
  } else if (act === 'del'){
    const fixed = i === 0 || (c.type === 'segment' && i === c.lines.length - 1);
    if (fixed){ alert(tx('cantDelLine')); return; }
    if (!confirm(tx('delLineConfirm', lineName(c, i)))) return;
    c.lines.splice(i, 1); cv.sel = Math.max(0, i - 1); saveCourses(); renderCourseTab(); return;
  }
  refreshLine();
});
$('#cLines').addEventListener('change', e => {
  if (e.target.dataset.f !== 'pt') return;
  const c = editCourse(), l = c.lines[+e.target.closest('.lineCard').dataset.i];
  if (!e.target.value.trim()){ l.c = null; refreshLine(); return; }
  const p = parseLatLon(e.target.value);
  if (!p){ alert(tx('badPoint')); return; }
  l.c = p; refreshLine();
});
$('#cSel').addEventListener('change', e => { cv.id = e.target.value; cv.sel = 0; renderCourseTab(); });
$('#cName').addEventListener('change', e => { editCourse().name = e.target.value.trim() || tx('untitled'); saveCourses(); renderCourseTab(); });
$('#cType').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const c = editCourse(); c.type = b.dataset.t; migrateCourse(c); saveCourses(); renderCourseTab();
});
$('#cNew').addEventListener('click', () => {
  const c = migrateCourse({ id: 'c' + Date.now(), name: tx('newCourse'), type: 'circuit', lines: [newLine()] });
  courses.push(c); cv.id = c.id; cv.sel = 0; saveCourses(); renderCourseTab();
  $('#cName').focus();
});
$('#cAddLine').addEventListener('click', () => {
  const c = editCourse();
  if (c.type === 'segment'){ c.lines.splice(c.lines.length - 1, 0, newLine()); cv.sel = c.lines.length - 2; }
  else { c.lines.push(newLine()); cv.sel = c.lines.length - 1; }
  saveCourses(); renderCourseTab();
});
$('#cDel').addEventListener('click', () => {
  if (courses.length < 2){ alert(tx('oneCourse')); return; }
  const c = editCourse();
  if (!confirm(tx('delCourseConfirm', c.name))) return;
  courses = courses.filter(x => x !== c); cv.id = courses[0].id; cv.sel = 0; saveCourses(); renderCourseTab();
});
$('#cAuto').addEventListener('click', () => {
  const c = editCourse(), v = $('#cSessSel').value, all = courseSessions(c);
  const arr = v === '*' ? all : all.filter(s => s.id === v);
  if (!arr.length) return;
  if (autoHeadings(c, arr) && !courseProblem(c) && confirm(tx('autoRecalcConfirm', arr.length))) arr.forEach(s => recalcSession(s, false));
});

// ---------- 設定タブ ----------
function renderSettings(){
  $$('#langSeg button').forEach(b => b.classList.toggle('on', b.dataset.l === settings.lang));
  const v = curVehicle();
  $('#vehSel').innerHTML = vehicles.map(x => `<option value="${esc(x.id)}"${x.id === v.id ? ' selected' : ''}>${esc(x.name)}（${esc(tx(x.type === 'car' ? 'car' : 'bike'))}）</option>`).join('');
  $('#vehName').value = v.name;
  $$('input[name=vehType]').forEach(r => r.checked = r.value === v.type);
  $('#bikeBox').hidden = v.type !== 'bike'; $('#carBox').hidden = v.type !== 'car';
  $('#flipF').checked = !!v.flipF; $('#flipL').checked = !!v.flipL;
  if (v.cal){ const b = makeBasis(v.cal); $('#calInfo').textContent = tx('calDone', fmtDate(v.cal.at), Math.round(Math.asin(Math.max(-1, Math.min(1, b.up[2]))) / D2R)); }
  else $('#calInfo').textContent = tx('calNot');
  $('#optMinLap').value = settings.minLap; $('#optAcc').value = settings.maxAcc;
}
$('#langSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; settings.lang = b.dataset.l; saveSettings(); applyLang(); renderTab(); });
$('#vehSel').addEventListener('change', e => { vehicleId = e.target.value; saveVehicles(); renderSettings(); });
$('#vehName').addEventListener('change', e => { curVehicle().name = e.target.value.trim() || tx('untitled'); saveVehicles(); renderSettings(); });
$$('input[name=vehType]').forEach(r => r.addEventListener('change', () => { curVehicle().type = r.value; saveVehicles(); renderSettings(); }));
$('#flipF').addEventListener('change', e => { curVehicle().flipF = e.target.checked; saveVehicles(); });
$('#flipL').addEventListener('change', e => { curVehicle().flipL = e.target.checked; saveVehicles(); });
$('#vehNew').addEventListener('click', () => {
  const v = { id: 'v' + Date.now(), name: tx('newVehicle'), type: 'car', cal: null, flipF: false, flipL: false };
  vehicles.push(v); vehicleId = v.id; saveVehicles(); renderSettings(); $('#vehName').focus();
});
$('#vehDel').addEventListener('click', () => {
  if (vehicles.length < 2){ alert(tx('oneVeh')); return; }
  if (!confirm(tx('delVehConfirm', curVehicle().name))) return;
  vehicles = vehicles.filter(v => v.id !== vehicleId); vehicleId = vehicles[0].id; saveVehicles(); renderSettings();
});
$('#calBtn').addEventListener('click', async () => {
  const v = curVehicle(), btn = $('#calBtn');
  if (!(await motionPermission())){ alert(tx('motionPerm')); return; }
  btn.disabled = true; btn.textContent = tx('calMeasuring');
  mo.cal = []; const wasOn = mo.listening; motionListen(true);
  await sleep(2000);
  const arr = mo.cal; mo.cal = null;
  if (!wasOn && !rec.on) motionListen(false);
  btn.disabled = false; btn.textContent = tx('calBtn');
  if (arr.length < 10){ alert(tx('calNoData')); return; }
  const g = [0, 1, 2].map(k => arr.reduce((a, x) => a + x[k], 0) / arr.length), m = Math.hypot(...g);
  const shake = Math.max(...arr.map(x => Math.hypot(x[0] - g[0], x[1] - g[1], x[2] - g[2])));
  if (Math.abs(m - G0) > 1.5 || shake > 1.5){ alert(tx('calShake')); return; }
  const cal = { g, angle: screenAngle(), at: Date.now() };
  if (Math.abs(vdot(g, screenUpDevice(cal.angle))) / m < 0.5){ alert(tx('calRotate')); return; }
  if (makeBasis(cal).flat < 0.3){ alert(tx('calFlat')); return; }
  v.cal = cal; saveVehicles(); renderSettings();
});
[['#optMinLap', 'minLap', 5], ['#optAcc', 'maxAcc', 3]].forEach(([sel, key, min]) =>
  $(sel).addEventListener('change', e => {
    const v = parseFloat(e.target.value);
    settings[key] = num(v) ? Math.max(min, v) : DEFAULT_OPT[key];
    saveSettings(); renderSettings();
  }));

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (curTab === 'v-run'){ if (rec.on) drawGMeter(true); else renderHome(); }
    if (curTab === 'v-rec' && recState.view === 'lap'){ buildLapLayers(); lvUpdate(); }
    if (curTab === 'v-course'){ drawCoursePreview(); drawLineZoom(); }
  }, 150);
});

// ---------- 起動 ----------
(async () => {
  applyLang();
  try {
    await DB.open();
    sessions = await DB.all();
  } catch (e){ showBanner(tx('dbFail')); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  for (const s of sessions){
    let dirty = false;
    if (s.active){ s.active = false; dirty = true; }                      // 前回、記録中に閉じられたもの
    if (!s.vehicle){ s.vehicle = vehSnap(vehicles[0]); dirty = true; }    // 車両の登録より前の記録
    if (!s.mode){ s.mode = 'circuit'; dirty = true; }
    if (s.course && s.course.lines && (!s.course.type || s.course.lines.some(l => l && 'a' in l))){ migrateCourse(s.course); dirty = true; }
    if (dirty) DB.put(s);
  }
  sessions.sort((a, b) => b.startedAt - a.startedAt);
  saveCourses();
  ready = true;
  $('#startBtn').disabled = false;
  applyLang();
  renderHome();
  startGeo();
})();
